services:
  app:
    build: .
    container_name: mohablog-app
    volumes:
      - .:/var/www
    networks:
      - albaraka

  nginx:
    image: nginx:alpine
    container_name: mohablog-nginx
    ports:
      - "${PORT:-8000}:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - albaraka

networks:
  albaraka:
    external: true
    name: albaraka-insfund_albaraka

