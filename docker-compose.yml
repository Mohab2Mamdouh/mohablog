services:
  app:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: mohablog-app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - mohablog

  nginx:
    image: nginx:alpine
    container_name: mohablog-nginx
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - mohablog

  db:
    image: mysql:8.0
    container_name: mohablog-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-mohablog}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mohablog-db:/var/lib/mysql
    networks:
      - mohablog

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mohablog-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      - db
    networks:
      - mohablog

networks:
  mohablog:

volumes:
  mohablog-db:
